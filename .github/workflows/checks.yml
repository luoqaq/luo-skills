name: Validate skills and site

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate skills
        run: python3 scripts/validate-skills.py
      - name: Build and check site
        run: python3 scripts/build-site.py --out "$RUNNER_TEMP/skills-site"
