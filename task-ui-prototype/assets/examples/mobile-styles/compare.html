<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>移动端视觉预设 · 同题比较</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#e9ecf1;color:#283247;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:1218px;margin:auto;padding:20px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;margin:0 0 6px}p{font-size:13px;color:#5f6b7d;margin:0;line-height:1.6}.controls{display:flex;align-items:center;gap:18px}label{font-size:14px;display:flex;align-items:center;gap:6px;min-height:44px}input{width:20px;height:20px}a{color:#354a73;min-height:44px;display:inline-flex;align-items:center;font-size:14px}main{max-width:1218px;margin:0 auto 28px;display:grid;grid-template-columns:repeat(3,390px);gap:24px}h2{font-size:16px;margin:0 0 8px}article>p{min-height:38px;font-size:12px}iframe{display:block;width:390px;height:844px;border:0;background:#fff}main.gray iframe{filter:grayscale(1)}@media(max-width:1250px){header{padding:18px 16px;max-width:820px}main{grid-template-columns:repeat(2,390px);max-width:804px}}@media(max-width:830px){header{display:block;max-width:430px}.controls{margin-top:6px}main{display:flex;flex-direction:column;align-items:center;gap:28px}article{max-width:100%;padding:0 12px}iframe{width:min(390px,calc(100vw - 24px))}h2,p{padding:0 2px}}
</style></head>
<body>
<header><div><h1>同一任务，三种视觉语言</h1><p>同商品、同字段、同交互 · 桌面画布 390 × 844，窄屏随窗口 · 演示数据 / 款式示意</p></div><div class="controls"><label><input id="gray" type="checkbox">灰度检查</label><a href="index.html">单屏操作预览</a></div></header>
<main id="stage">
<article><h2>A · 纸本目录</h2><p>宋体字排 / 连续横线 / 纸色平面</p><iframe title="纸本目录 390×844" src="index.html?canvas=1#a"></iframe></article>
<article><h2>B · 柔和工作台</h2><p>无衬线字阶 / 功能分组 / 圆润控件</p><iframe title="柔和工作台 390×844" src="index.html?canvas=1#b"></iframe></article>
<article><h2>C · 机能终端</h2><p>等宽数字 / 字段网格 / 方角分区</p><iframe title="机能终端 390×844" src="index.html?canvas=1#c"></iframe></article>
</main>
<script>document.getElementById('gray').addEventListener('change',event=>document.getElementById('stage').classList.toggle('gray',event.target.checked));</script>
</body></html>
