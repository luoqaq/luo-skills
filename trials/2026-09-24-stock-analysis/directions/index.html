<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向稿对比 — 总览页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { height: 100vh; overflow: hidden; }
  iframe { border: none; width: 100%; height: 100vh; display: block; }
  iframe.hidden { display: none; }
  .dock {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; z-index: 10;
    background: rgba(28, 28, 30, 0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 999px; padding: 4px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
  }
  .dock button {
    border: none; background: transparent; color: #d4d4d4; cursor: pointer;
    font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px;
    padding: 8px 18px; border-radius: 999px; white-space: nowrap;
  }
  .dock button.active { background: #fff; color: #111; font-weight: 600; }
</style>
</head>
<body>
<iframe id="frameA" src="a-workbench.html"></iframe>
<iframe id="frameB" src="b-cockpit.html" class="hidden"></iframe>
<div class="dock">
  <button id="btnA" class="active" onclick="show('A')">A · 数据工作台</button>
  <button id="btnB" onclick="show('B')">B · 分析驾驶舱</button>
</div>
<script>
  function show(which) {
    document.getElementById('frameA').classList.toggle('hidden', which !== 'A');
    document.getElementById('frameB').classList.toggle('hidden', which !== 'B');
    document.getElementById('btnA').classList.toggle('active', which === 'A');
    document.getElementById('btnB').classList.toggle('active', which === 'B');
  }
</script>
</body>
</html>
