<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向稿对比 — 总览页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #1a1a1a; height: 100vh; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #1a1a1a; color: #fff; flex-shrink: 0; }
  .bar .title { font-size: 13px; color: #999; }
  .seg { display: flex; background: #2c2c2c; border-radius: 8px; padding: 3px; }
  .seg button {
    border: none; background: transparent; color: #bbb; font-size: 13px;
    padding: 6px 16px; border-radius: 6px; cursor: pointer;
  }
  .seg button.active { background: #fff; color: #1a1a1a; font-weight: 600; }
  .bar .hint { margin-left: auto; font-size: 12px; color: #777; }
  iframe { flex: 1; border: none; width: 100%; }
  iframe.hidden { display: none; }
</style>
</head>
<body>
<div class="bar">
  <span class="title">总览页 · 方向稿对比</span>
  <div class="seg">
    <button id="btnA" class="active" onclick="show('A')">A · 数据工作台</button>
    <button id="btnB" onclick="show('B')">B · 分析驾驶舱</button>
  </div>
  <span class="hint">两个方向稿共用同一份演示数据，仅布局/密度/配色不同</span>
</div>
<iframe id="frameA" src="a-workbench.html"></iframe>
<iframe id="frameB" src="b-cockpit.html" class="hidden"></iframe>
<script>
  function show(which) {
    document.getElementById('frameA').classList.toggle('hidden', which !== 'A');
    document.getElementById('frameB').classList.toggle('hidden', which !== 'B');
    document.getElementById('btnA').classList.toggle('active', which === 'A');
    document.getElementById('btnB').classList.toggle('active', which === 'B');
  }
</script>
</body>
</html>
