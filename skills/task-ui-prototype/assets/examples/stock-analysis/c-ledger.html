<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>观澜 · 投资总览</title>
  <style>
    :root{--paper:#f5f6f2;--white:#fff;--ink:#202d27;--muted:#8a938d;--line:#e4e8e1;--forest:#143c2e;--lime:#d0e6aa;--up:#ab584e;--down:#35745a;--dialog-bg:#fff;--dialog-ink:#202d27;--dialog-muted:#7b857d;--dialog-border:#e4e8e1;--dialog-accent:#27523c}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #a4bc6e;outline-offset:5px}a{color:inherit;text-decoration:none}button{border:0;background:none}svg{display:block}h1,h2,p{margin:0}.number{font-family:"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.muted{color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}.arrow{transition:transform .18s ease;font-size:20px;font-weight:300;line-height:1}.layout{display:grid;grid-template-columns:clamp(330px,28.5vw,410px) minmax(0,1fr);min-height:100vh;padding-bottom:100px}
    .account{background:var(--forest);color:#f5f8f1;border-radius:0 0 30px 0;padding:36px 34px 30px;position:sticky;top:0;align-self:start;min-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:36px;height:36px}.brand-name{font-size:27px;letter-spacing:4px;font-weight:550}.brand-en{font-size:9px;letter-spacing:3.5px;color:#a6bca9;margin-top:5px}.account-label{display:flex;align-items:center;gap:7px;font-size:11px;color:#becbbb;margin:49px 0 16px}.account-label:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lime)}.asset-label{color:#b6c7bb;font-size:12px;letter-spacing:.6px}.asset-value{display:flex;align-items:baseline;gap:8px;margin-top:11px;white-space:nowrap}.currency{font-size:22px;color:#b6c7bb}.asset-value .number{font-size:clamp(36px,3.15vw,46px);font-weight:400;line-height:1.12}.asset-value .decimal{font-size:.48em;color:#bed0bf;letter-spacing:-.015em}.daily{display:flex;align-items:baseline;gap:12px;margin-top:17px;padding-bottom:26px;border-bottom:1px solid #ffffff20}.daily-title{color:#acbfae;font-size:11px}.daily .number{font-size:19px;color:var(--lime);letter-spacing:-.025em}.daily .rate{font-size:11px;color:var(--lime)}
    .performance{margin-top:27px}.section-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-top h2{font-size:12px;font-weight:500;color:#bdcbbb}.ranges{display:flex;gap:3px}.ranges button{font-size:10px;color:#9fb5a5;padding:6px 7px;border-radius:6px;transition:color .15s,background .15s}.ranges button[aria-pressed=true],.ranges button.active{background:#ffffff19;color:#f0f7e5}.ranges button:hover{background:#ffffff12;color:white}.chart{margin:25px -4px 0;position:relative}.chart svg{width:100%;height:auto;overflow:visible}.chart .grid{stroke:#ffffff13;stroke-width:1}.chart text{fill:#809e8b;font:17px Arial,sans-serif}.chart [data-chart-line]{stroke:var(--lime);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.chart [data-chart-fill]{fill:url(#chart-area)}.chart-labels{display:flex;justify-content:space-between;font-size:10px;color:#8fab98;margin-top:12px}.allocation{margin-top:32px;padding-top:24px;border-top:1px solid #ffffff20}.allocation-total{display:flex;justify-content:space-between;align-items:baseline}.allocation-total>span{color:#b6c7bb;font-size:12px}.allocation-total strong{font-size:30px;font-weight:400;color:var(--lime)}.allocation-track{display:flex;gap:4px;height:6px;margin:17px 0 11px}.allocation-track span{background:var(--lime);border-radius:2px}.allocation-track .cash-segment{background:#486854}.allocation-caption{display:flex;justify-content:space-between;color:#9fb5a5;font-size:10px}.account-foot{margin-top:auto;padding-top:35px;display:flex;align-items:center;justify-content:space-between;color:#97ae9c;font-size:10px;line-height:1.8}.account-foot svg{width:22px;height:22px;color:#789780}
    .workspace{min-width:0;padding:0 42px 28px;animation:arrive .6s ease both}.topbar{min-height:92px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:20px}.nav{display:flex;align-items:center;justify-content:space-between;gap:22px;flex:1;white-space:nowrap}.nav a{font-size:12px;color:#8a928b;position:relative;line-height:40px;transition:color .2s}.nav a:hover{color:var(--forest)}.nav a[aria-current]{color:var(--forest);font-weight:650}.nav a[aria-current]:after{content:"";position:absolute;height:3px;background:var(--forest);border-radius:3px;width:15px;left:calc(50% - 7.5px);bottom:-26px}.avatar{flex:0 0 28px;height:28px;margin-left:3px;border-radius:50%;background:#e5e9e0;display:grid;place-items:center;color:#536c54;font-size:10px}.page-title{display:flex;justify-content:space-between;align-items:center;padding:30px 0 27px}.page-title h1{font-size:28px;letter-spacing:-1px;font-weight:550}.datestamp{display:flex;align-items:center;gap:13px;color:#869087;font-size:11px}.datestamp .date{letter-spacing:1px;color:#647266;font-size:12px}.market-close{display:inline-flex;align-items:center;gap:5px}.market-close:before{content:"";height:4px;width:4px;background:#a5af9f;border-radius:50%}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section-heading .left{display:flex;gap:10px;align-items:baseline}.section-heading h2{font-size:16px;font-weight:600;letter-spacing:.3px}.count{font-size:12px;color:#8d978d;letter-spacing:.02em}.section-description{font-size:11px;color:#8f988e}.holdings{background:#fff;padding:25px 25px 10px;border-radius:17px}.holdings .section-heading{margin-bottom:20px}.table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}.table col:first-child{width:27%}.table col:nth-child(2){width:15%}.table col:nth-child(3){width:14%}.table col:nth-child(4){width:14%}.table col:nth-child(5){width:14%}.table col:nth-child(6){width:16%}.table th{font-size:10px;font-weight:400;color:#929b91;text-align:right;padding:0 0 13px;border-bottom:1px solid var(--line)}.table th:first-child{text-align:left}.table td{height:56px;text-align:right;border-bottom:1px solid #eff1eb;white-space:nowrap}.table tr:last-child td{border:0}.stock-name{display:flex;align-items:center;gap:11px;padding:0;text-align:left;width:100%;height:55px}.stock-icon{width:28px;height:28px;display:grid;place-items:center;flex:0 0 28px;border-radius:9px;background:#f0f3eb;color:#687b5f;font-size:11px;transition:background .2s,transform .2s}.stock-name:hover .stock-icon{background:#dce8ce;transform:translateY(-2px)}.stock-label strong{font-size:12px;font-weight:550;display:block;line-height:1.55}.stock-label small{display:block;font:9px Arial,sans-serif;letter-spacing:.6px;color:#a2aa9e;line-height:1.65}.table .number{font-size:13px;letter-spacing:-.025em}.weight{display:flex;align-items:center;justify-content:flex-end;gap:8px}.weight .weight-track{width:31px;height:3px;background:#ecf0e8;border-radius:2px;overflow:hidden}.weight .weight-track i{height:100%;display:block;background:#9ab486;border-radius:2px}.stock-status{font-size:10px;color:#8b9688;padding:6px 0 6px 6px;display:inline-flex;align-items:center;gap:6px}.stock-status.pending{color:#6d8059}.stock-status.pending:before{content:"";width:4px;height:4px;background:#88a26a;border-radius:50%}.stock-status:hover{color:var(--forest)}
    .research{padding-top:28px}.research .section-heading{margin-bottom:7px}.section-action{font-size:11px;display:flex;align-items:center;gap:9px;color:#5f7658;padding:5px 0}.section-action:hover .arrow{transform:translateX(4px)}.review-list{margin-top:4px}.review-row{display:grid;grid-template-columns:24px minmax(0,1fr) 180px 27px;align-items:center;gap:16px;min-height:77px;width:100%;border-bottom:1px solid var(--line);text-align:left;padding:11px 0;transition:background .18s,padding .18s}.review-row:hover{padding-left:8px;background:#ecefe6}.review-row:hover .arrow{transform:translateX(4px)}.review-index{color:#9fa998;font-size:11px;align-self:start;padding-top:5px}.review-title{font-size:12px;font-weight:550;line-height:1.5;display:flex;align-items:center;gap:9px}.review-title .tag{font-size:9px;font-weight:400;color:#8b957f;border:1px solid #dee3d6;border-radius:3px;padding:1px 4px;white-space:nowrap}.review-desc{display:block;margin-top:5px;color:#8a9587;font-size:10px;line-height:1.5}.review-diff{font-size:12px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:9px;white-space:nowrap}.review-diff .before{color:#a2ab9b;font-size:11px}.review-diff .after{color:#526b43;font-weight:550}.review-diff .diff-arrow{color:#b1baa8}.review-row>.arrow{color:#829675;text-align:right}.tasks{padding-top:24px}.tasks .section-heading{margin-bottom:16px}.task-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}.task-item{padding:0 19px;text-align:left;min-width:0;border-left:1px solid #dce2d6;transition:opacity .18s}.task-item:first-child{padding-left:0;border-left:0}.task-item:last-child{padding-right:0}.task-item:hover{opacity:.65}.task-status{display:flex;align-items:center;gap:6px;font-size:10px;color:#879280;margin-bottom:8px}.status-dot{width:5px;height:5px;background:#9fada0;border-radius:50%}.status-dot.running{background:#7b9a60;box-shadow:0 0 0 3px #e8eedf}.status-dot.failed{background:#b88459}.task-name{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:550;line-height:1.5}.task-name span{font-size:10px;color:#9ca695;font-weight:400}.task-detail{margin-top:5px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px;color:#94a08c;line-height:1.5}.task-progress{height:2px;width:40px;background:#dfe6d7}.task-progress i{display:block;height:100%;background:#97ad81}.page-foot{margin-top:26px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:#a2aa9b;font-size:9px;letter-spacing:.3px;line-height:1.6}.animate-row{animation:arrive .55s ease both;animation-delay:calc(var(--i)*55ms)}@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:1500px){.workspace{padding-right:55px;padding-left:55px}.account{padding-left:40px;padding-right:40px}}
    @media(max-width:1320px){.workspace{padding-left:28px;padding-right:28px}.nav{gap:14px}.account{padding-left:29px;padding-right:29px}.topbar{gap:13px}.holdings{padding-left:20px;padding-right:20px}.review-row{grid-template-columns:20px minmax(0,1fr) 161px 18px;gap:11px}.review-title{gap:7px}.review-title .tag{font-size:8px}.review-diff{font-size:11px;gap:7px}.stock-name{gap:8px}.task-item{padding-left:14px;padding-right:14px}}
    @media(max-width:1000px){.layout{grid-template-columns:290px minmax(0,1fr)}.account{padding-left:23px;padding-right:23px}.asset-value .number{font-size:33px}.workspace{padding-left:23px;padding-right:23px}.nav{gap:14px;flex-wrap:wrap;justify-content:flex-start;padding:15px 0}.topbar{min-height:80px}.nav a{font-size:11px;line-height:22px}.nav a[aria-current]:after{bottom:-6px}.avatar{display:none}.table col:first-child{width:28%}.table col:nth-child(2){width:17%}.table col:nth-child(3){width:14%}.table col:nth-child(4){width:11%}.table col:nth-child(5){width:14%}.table col:nth-child(6){width:16%}.stock-icon,.weight-track{display:none!important}.holdings{padding-left:16px;padding-right:16px}.review-row{grid-template-columns:17px minmax(0,1fr) 20px;gap:10px}.review-diff{display:none}.review-desc{font-size:9px}.page-title h1{font-size:24px}.datestamp .date{font-size:10px;letter-spacing:0}.datestamp{gap:7px}.task-name{display:block}.task-name span{display:block;margin-top:3px}.review-title .tag{display:none}}
    @media(max-width:700px){.layout{display:block}.account{position:relative;border-radius:0 0 24px 24px;min-height:auto;padding:28px}.brand{margin-bottom:26px}.account-label{margin-top:0}.asset-value .number{font-size:42px}.performance{max-width:420px}.chart{margin-top:10px}.allocation{margin-top:25px}.account-foot{padding-top:20px}.workspace{padding:0 18px 25px}.topbar{min-height:85px}.page-title{padding:24px 0}.table td{height:59px}.table th{font-size:9px}.table .number{font-size:11px}.stock-label strong{font-size:11px}.stock-status{font-size:9px}.section-description{font-size:10px}.task-list{gap:15px;grid-template-columns:1fr}.task-item,.task-item:first-child{padding:0 0 14px;border:0;border-bottom:1px solid var(--line)}.task-name{display:flex}.task-name span{display:inline}.task-status{margin-bottom:5px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="layout" id="overview">
    <aside class="account" id="account" aria-label="资产摘要">
      <a class="brand" href="#overview" aria-label="观澜总览">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M7 28V14C7 9.58 10.58 6 15 6h18v14c0 7.73-6.27 14-14 14H7" stroke="#d0e6aa" stroke-width="1.6"/><path d="M7 27c5.7 0 5.7-13 11.4-13S24.1 27 29.8 27M7 21c5.7 0 5.7 8 11.4 8S24.1 12 33 12" stroke="#d0e6aa" stroke-width="1.6"/></svg>
        <div><div class="brand-name">观澜</div><div class="brand-en">GUANLAN</div></div>
      </a>
      <p class="account-label">我的演示账户</p>
      <p class="asset-label">总资产</p>
      <div class="asset-value"><span class="currency">¥</span><span class="number" id="asset-total"></span></div>
      <div class="daily"><span class="daily-title">今日收益</span><span class="number" id="daily-total"></span><span class="rate" id="daily-rate"></span></div>
      <section class="performance" aria-label="模拟净值走势">
        <div class="section-top"><h2>模拟净值</h2><div class="ranges" role="group" aria-label="净值时间范围"><button data-range="1W" aria-pressed="false">1W</button><button data-range="1M" aria-pressed="false">1M</button><button data-range="3M" aria-pressed="true" class="active">3M</button></div></div>
        <div class="chart"><svg viewBox="0 0 600 180" role="img" aria-label="演示组合模拟净值走势"><defs><linearGradient id="chart-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d0e6aa" stop-opacity=".14"/><stop offset="100%" stop-color="#d0e6aa" stop-opacity="0"/></linearGradient></defs><path class="grid" d="M0 20H600M0 90H600M0 160H600"/><path data-chart-fill></path><path data-chart-line></path></svg></div>
        <div class="chart-labels"><span>期初</span><span>2026.09.24</span></div>
      </section>
      <section class="allocation" aria-label="持仓配置"><div class="allocation-total"><span>持仓占比</span><strong class="number" id="exposure"></strong></div><div class="allocation-track" id="allocation-track" aria-hidden="true"></div><div class="allocation-caption"><span>6 只持仓</span><span id="cash"></span></div></section>
      <div class="account-foot"><span>数据截至 2026.09.24 收盘<br>自报持仓 · 演示账户</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18V9m6 9V5m6 13v-6M3 21h18" stroke="currentColor" stroke-width="1.2"/></svg></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><nav class="nav" aria-label="主导航"><a href="#overview" aria-current="page">总览</a><a href="#holdings">当前持仓</a><a href="#research">单股研究</a><a href="#research">机会发现</a><a href="#tasks">策略中心</a><a href="#account">模拟组合</a><a href="#tasks">任务记录</a></nav><span class="avatar" aria-label="演示账户">GL</span></header>
      <div class="page-title"><h1>投资总览</h1><div class="datestamp"><span class="date number">2026.09.24</span><span class="market-close">已收盘</span></div></div>
      <section class="holdings" id="holdings" aria-labelledby="holdings-title"><div class="section-heading"><div class="left"><h2 id="holdings-title">当前持仓</h2><span class="count" id="stock-count"></span></div><span class="section-description">自报持仓 · A 股</span></div><table class="table"><colgroup><col><col><col><col><col><col></colgroup><thead><tr><th scope="col">名称 / 代码</th><th scope="col">现价</th><th scope="col">今日涨跌</th><th scope="col">仓位</th><th scope="col">持有收益</th><th scope="col">研究更新</th></tr></thead><tbody id="holdings-body"></tbody></table></section>
      <section class="research" id="research" aria-labelledby="research-title"><div class="section-heading"><div class="left"><h2 id="research-title">待审阅</h2><span class="count" id="review-count"></span></div><button class="section-action" data-review="0">开始审阅 <span class="arrow" aria-hidden="true">↗</span></button></div><div class="review-list" id="review-list"></div></section>
      <section class="tasks" id="tasks" aria-labelledby="tasks-title"><div class="section-heading"><div class="left"><h2 id="tasks-title">任务记录</h2><span class="count" id="task-count"></span></div><span class="section-description">1 项正在运行</span></div><div class="task-list" id="task-list"></div></section>
      <footer class="page-foot"><span>价格、研究内容与图表均为演示数据</span><span>仅供原型体验</span></footer>
    </main>
  </div>
  <script src="data.js"></script>
  <script>
    const d = window.StudyData;
    const $ = id => document.getElementById(id);
    const signClass = value => /^[−-]/.test(value) ? 'down' : 'up';
    const totalParts = d.total.split('.');
    $('asset-total').innerHTML = totalParts[0] + '<span class="decimal">.' + totalParts[1] + '</span>';
    $('daily-total').textContent = d.daily;
    $('daily-rate').textContent = d.dailyRate;
    $('exposure').textContent = d.exposure;
    $('cash').textContent = '现金 ' + d.cash;
    $('stock-count').textContent = String(d.stocks.length).padStart(2, '0');
    $('review-count').textContent = String(d.reviews.length).padStart(2, '0');
    $('task-count').textContent = String(d.tasks.length).padStart(2, '0');
    $('allocation-track').innerHTML = d.stocks.map((s, i) => '<span style="flex:' + parseFloat(s.weight) + ';opacity:' + (1 - i * .1) + '"></span>').join('') + '<span class="cash-segment" style="flex:' + parseFloat(d.cash) + '"></span>';
    $('holdings-body').innerHTML = d.stocks.map((s, i) => `<tr class="animate-row" style="--i:${i}"><td><button class="stock-name" data-stock="${i}" aria-label="查看${s.name}持仓"><span class="stock-icon" aria-hidden="true">${s.name[0]}</span><span class="stock-label"><strong>${s.name}</strong><small>${s.code}</small></span></button></td><td class="number">${s.price}</td><td class="number ${signClass(s.change)}">${s.change}</td><td><span class="weight"><span class="weight-track" aria-hidden="true"><i style="width:${parseFloat(s.weight)/28*100}%"></i></span><span class="number">${s.weight}</span></span></td><td class="number ${signClass(s.profit)}">${s.profit}</td><td><button class="stock-status ${s.status === '待审阅' ? 'pending' : ''}" data-stock="${i}" aria-label="查看${s.name}研究状态">${s.status}</button></td></tr>`).join('');
    $('review-list').innerHTML = d.reviews.map((r, i) => `<button class="review-row" data-review="${i}" aria-label="审阅${r.title}"><span class="review-index number">${String(i + 1).padStart(2, '0')}</span><span><span class="review-title">${r.title}<span class="tag">${r.tag}</span></span><span class="review-desc">${r.description}</span></span><span class="review-diff"><span class="before">${r.before}</span><span class="diff-arrow">→</span><span class="after">${r.after}</span></span><span class="arrow" aria-hidden="true">↗</span></button>`).join('');
    $('task-list').innerHTML = d.tasks.map((t, i) => `<button class="task-item" data-task="${i}" aria-label="查看${t.name}任务"><span class="task-status"><i class="status-dot ${i === 0 ? 'running' : i === 2 ? 'failed' : ''}"></i>${t.status}</span><span class="task-name">${t.name}<span>${t.target}</span></span><span class="task-detail">${t.detail}${t.progress ? '<span class="task-progress" aria-label="进度 '+t.progress+'%"><i style="width:'+t.progress+'%"></i></span>' : '<span aria-hidden="true">↗</span>'}</span></button>`).join('');
    const initialPoints = d.series['3M'].map((v, i, a) => [i / (a.length - 1) * 600, 160 - (v - 1.1) / .2 * 140]);
    const initialLine = initialPoints.map((p, i) => (i ? 'L' : 'M') + p.join(',')).join(' ');
    document.querySelector('[data-chart-line]').setAttribute('d', initialLine);
    document.querySelector('[data-chart-fill]').setAttribute('d', initialLine + ' L600,180 L0,180 Z');
  </script>
  <script src="interactions.js"></script>
</body>
</html>
