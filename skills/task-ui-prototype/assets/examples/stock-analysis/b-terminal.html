        <div class="reviews-list" id="reviews-list"></div>
        <section class="tasks" id="tasks" aria-labelledby="tasks-title"><div class="tasks-header"><h2 id="tasks-title">任务队列</h2><span id="task-count" class="num"></span></div><div id="tasks-list"></div></section>
        <div class="inspector-foot"><svg viewBox="0 0 16 16"><path d="M8 1.5 13 4v4c0 3-5 6-5 6S3 11 3 8V4zM6 7l1.5 1.5L10 6"/></svg><span>研究建议经审阅后由你决策</span></div>
      </aside>
    </div>
  </div>
  <script src="data.js"></script>
  <script>
    (() => {
      const d = window.StudyData;
      const polarity = value => /^[−-]/.test(value) ? 'down' : 'up';
      const [whole, fraction] = d.total.split('.');
      document.getElementById('summary').innerHTML = `<div><div class="asset-label">总资产</div><div class="asset-total num"><span class="currency">¥</span>${whole}<span class="decimal">.${fraction}</span></div></div><div class="summary-stats"><div><div class="stat-label">今日收益</div><div class="stat-value num up">+¥${d.daily.replace('+','')}<small>${d.dailyRate}</small></div></div><div class="exposure-stat"><div class="stat-label">总仓位</div><div class="stat-value num">${d.exposure}</div></div></div>`;
      document.getElementById('stock-count').textContent = String(d.stocks.length).padStart(2, '0');
      document.getElementById('cash-ratio').textContent = `可用现金 ${d.cash}`;
      document.getElementById('holdings-body').innerHTML = d.stocks.map((s, i) => `<tr><td><button class="stock-button" data-stock="${i}" aria-label="查看${s.name}持仓"><span class="stock-name">${s.name}</span><span class="stock-code num">${s.code}<span class="stock-sector">${s.sector}</span></span></button></td><td class="num">${s.price}</td><td class="num ${polarity(s.change)}">${s.change}</td><td class="num"><span class="weight-wrap"><span class="weight-bar" aria-hidden="true"><i style="width:${parseFloat(s.weight)/30*100}%"></i></span>${s.weight}</span></td><td class="num ${polarity(s.profit)}">${s.profit}</td><td><span class="research-status ${s.status === '待审阅' ? 'pending' : ''}">${s.status}</span></td></tr>`).join('');
      document.getElementById('review-count').textContent = `${d.reviews.length} 项待审阅`;
      document.getElementById('reviews-list').innerHTML = d.reviews.map((r, i) => {
        const name = r.title.split(' · ')[0];
        return i === 0 ? `<article class="review-item"><div class="review-meta"><span>${r.tag}</span><span class="review-num num">R—0${i+1}</span></div><h3 class="review-title">${r.title}</h3><p class="review-copy">${r.description}</p><div class="review-diff"><div class="diff-block"><div class="diff-label">当前仓位</div><div class="diff-value num">${r.before}</div></div><span class="diff-arrow">→</span><div class="diff-block after"><div class="diff-label">建议仓位</div><div class="diff-value num">${r.after}</div></div></div><button class="review-primary" data-review="${i}"><span>审阅证据与差异</span><span class="arrow" aria-hidden="true">↗</span></button></article>` : `<article class="review-item review-other"><div class="review-meta"><span>${r.tag}</span><span class="review-num num">R—0${i+1}</span></div><h3 class="review-title">${name} · ${r.short}</h3><p class="review-copy">${r.description}</p><div class="small-diff"><span>${r.before}</span><span aria-hidden="true">→</span><strong>${r.after}</strong></div><button class="review-link" data-review="${i}"><span>查看研究差异</span><span class="arrow" aria-hidden="true">↗</span></button></article>`;
      }).join('');
      document.getElementById('task-count').textContent = String(d.tasks.length).padStart(2,'0');
      document.getElementById('tasks-list').innerHTML = d.tasks.map((t, i) => `<button class="task ${i === 0 ? 'running' : i === 1 ? 'queued' : 'failed'}" data-task="${i}" aria-label="查看${t.name}任务"><div class="task-line"><span class="task-name"><i class="task-dot"></i>${t.name}</span><span class="task-status">${t.status}</span></div><div class="task-detail"><span>${t.target} · ${t.detail}</span>${t.progress ? `<span class="num">${t.progress}%</span>` : ''}</div>${t.progress ? `<div class="task-progress" aria-hidden="true"><i style="width:${t.progress}%"></i></div>` : ''}</button>`).join('');
      const series = d.series['1M'];
      const points = series.map((v, i) => `${i / (series.length - 1) * 600},${160 - (v - 1.1) / .2 * 140}`);
      document.querySelector('[data-chart-line]').setAttribute('d', 'M' + points.join('L'));
      document.querySelector('[data-chart-fill]').setAttribute('d', 'M0,160L' + points.join('L') + 'L600,160Z');
      document.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click', () => {
        const labels = { '1W':['09.18','09.19','09.22','09.23','09.24'], '1M':['08.25','09.02','09.10','09.18','09.24'], '3M':['06.25','07.17','08.08','08.31','09.24'] };
        document.querySelector('[data-chart-dates]').innerHTML = labels[button.dataset.range].map(label => `<span>${label}</span>`).join('');
      }));
    })();
  </script>
  <script src="interactions.js"></script>
</body>
</html>
